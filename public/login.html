  <body class="auth-page portal-workspace-page landing-page" data-shell="marketing"><div class="page shell-mk">

        <nav class="landing-nav portal-nav" aria-label="AgentX 资料平台导航"><span data-portal-nav></span><span class="portal-auth-slot" data-portal-auth><a href="/login">登录</a></span></nav>

      </header>
    <main class="login-shell narrow-workspace" aria-label="AgentX 登录"><section class="login-panel panel reveal d1"><div class="login-brand"><span class="brand-mark">AX</span><div><p>受控访问</p><h1>登录 AgentX</h1></div></div><form id="login-form" class="stack-form reference-form"><label for="username">账号</label><input id="username" class="input" name="username" type="text" autocomplete="username" required><label for="password">密码</label><input id="password" class="input" name="password" type="password" autocomplete="current-password" required><button id="login-submit" class="btn btn-primary primary-button" type="submit">登录</button><p id="login-error" class="error-line" role="alert"></p></form></section></main></div>
    <script src="/auth.js?v=2.2.42"></script><script src="/ui-kit.js?v=2.2.43"></script><script src="/product-shell.js?v=2.2.42"></script><script src="/assets/agentx-webui.js?v=2.2.43"></script><script>
      (() => {
        const form = document.getElementById('login-form'); const submit = document.getElementById('login-submit'); const error = document.getElementById('login-error'); const params = new URLSearchParams(window.location.search); const next = safeRedirectTarget(params.get('next')) || '/home'; const translate = (key) => window.AgentXI18n?.t?.(key) || key;
        function safeRedirectTarget(value) { if (!value || typeof value !== 'string') return ''; if (!value.startsWith('/') || value.startsWith('//') || value.includes('\\')) return ''; if (value.startsWith('/auth/') || value === '/login') return ''; return value; }
        form.addEventListener('submit', async (event) => { event.preventDefault(); error.textContent = ''; submit.disabled = true; submit.textContent = translate('portal.login.loggingIn'); try { await window.AgentXAuth.login(document.getElementById('username').value, document.getElementById('password').value); window.location.assign(next); } catch { error.textContent = translate('portal.login.invalid'); } finally { submit.disabled = false; submit.textContent = translate('portal.login.submit'); } });
        void validateExistingSession();
        async function validateExistingSession() { const token = window.AgentXAuth.getToken(); if (!token) return; try { const response = await window.AgentXAuth.authFetch('/auth/me', { skipAuthRedirect: true, keepTokenOn401: true }); if (window.AgentXAuth.getToken() !== token) return; if (response.ok) window.location.replace(next); else if (response.status === 401) { window.AgentXAuth.clearToken(); window.AgentXProductShell?.renderPortalAuth?.(document); } } catch { /* Keep the form usable during transient network failures. */ } }
      })();
    </script></body></html>
