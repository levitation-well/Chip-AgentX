  <body class="landing-page ticket-page portal-workspace-page reference-page" data-shell="marketing" data-active="datasheet">
    <div class="page landing-shell portal-workspace-shell shell-mk">
      <header class="landing-topbar portal-topbar float-nav" aria-label="AgentX 资料平台导航">
        <a class="landing-brand brand" href="/home" aria-label="返回 AgentX 首页"><span class="brand-mark logo">AX</span><span data-product-name>AgentX</span></a>
        <nav class="landing-nav portal-nav" aria-label="AgentX 资料平台导航"><span data-portal-nav></span><span class="portal-auth-slot" data-portal-auth><a href="/login">登录</a></span></nav>
        <div class="portal-skin-slot" data-agentx-skin-root></div>
      </header>
      <main class="portal-workspace-main narrow-workspace reference-main reference-narrow">
        <section class="workspace-title-block reveal d1"><h1>资料提交</h1><p class="muted small mt8">提交芯片资料或 datasheet，审核通过后纳入知识库。</p></section>
        <section id="datasheet-submit" class="panel ticket-query-card datasheet-submit-card reveal d1" aria-label="资料提交表单"><div class="panel-head"><div><h2>提交资料</h2><p class="sub">资料审核通过前不会对外展示。</p></div><span class="badge gray">生成 DS 编号</span></div>
          <form id="datasheet-ticket-form" class="feedback-ticket-form reference-form"><label class="field">资料标题<input class="input" name="title" type="text" maxlength="200" required placeholder="例如：YTM32B1ME0 datasheet"></label><div class="field-row"><label class="field">厂商 / 品牌<input class="input" name="vendor" type="text" maxlength="160" placeholder="例如：Yuntu Micro"></label><label class="field">芯片型号或关键词<input class="input" name="partNumberOrKeywords" type="text" maxlength="240" placeholder="YTM32B1ME0, UDS, OTA"></label></div><label class="field">来源说明<textarea class="textarea" name="sourceNote" rows="3" maxlength="1000" placeholder="官网、公开网页或用户整理来源，方便审核"></textarea></label><label class="field">来源声明<textarea class="textarea" name="sourceDeclaration" rows="2" maxlength="1000" placeholder="确认资料来源、授权或公开依据"></textarea></label><label class="field">联系方式<input class="input" name="contact" type="text" autocomplete="off" maxlength="500" placeholder="邮箱、手机或其他可联系信息"></label><label class="field">备注<textarea class="textarea" name="note" rows="3" maxlength="2000" placeholder="补充资料背景、适用芯片、版本或希望管理员注意的内容"></textarea></label><label class="field file-drop portal-file-dropzone">附件<span>拖拽文件到此，或点击选择 · 支持 pdf / zip / 7z / md / c / h / cpp</span><input id="datasheet-attachments" name="attachments" type="file" multiple required accept=".pdf,.zip,.7z,.md,.markdown,.txt,.c,.h,.cs,.cpp,.cxx,.cc,.hpp,.hh"></label><label class="choice checkbox-line"><input name="disclaimerAccepted" type="checkbox" required><span>我确认有权提交该资料，并了解资料需审核通过后方可使用。</span></label><div class="flex center gap12 form-actions"><button class="btn btn-primary primary-button" type="submit">提交资料</button><p id="datasheet-ticket-status" class="status-line" aria-live="polite">提交后进入审核</p></div></form></section>
      </main>
      <footer class="landing-footer portal-footer"><span data-product-signature>Powered by AgentX</span><span class="fingerprint-summary" data-product-fingerprint hidden></span><div data-product-changelog></div></footer>
    </div>
