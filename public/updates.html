<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgentX · 新闻与更新</title>
    <link rel="stylesheet" href="/styles.css?v=2.2.45">
    <link rel="stylesheet" href="/assets/agentx-webui.css?v=2.2.43">
    <script>(()=>{let l='zh-CN';try{const u=JSON.parse(localStorage.getItem('agentx.auth.user')||'null');const a=u&&(u.localePreference||u.preferredLanguage);const s=localStorage.getItem('agentx.locale.preference');const e=localStorage.getItem('agentx.locale.explicit')==='1';l=a==='en-US'||a==='zh-CN'?a:e&&(s==='en-US'||s==='zh-CN')?s:/^en/i.test(navigator.language||'')?'en-US':'zh-CN';}catch{}document.documentElement.lang=l;document.documentElement.dataset.agentxLocale=l;})();</script>
    <script src="/i18n.js?v=2.2.44"></script><script src="/assets/i18n-portal.js?v=2.2.44"></script><script src="/assets/i18n-mcp-tickets.js?v=2.2.45"></script>
    <script>(()=>{let skin='cal';try{const saved=localStorage.getItem('agentx.webui.skin');if(saved==='cal'||saved==='voltagent')skin=saved;}catch{}document.documentElement.dataset.agentxSkin=skin;})();</script>
      <link rel="icon" href="data:,">
  </head>
  <body class="landing-page portal-workspace-page updates-page reference-page" data-shell="marketing" data-active="updates">
    <div class="page landing-shell portal-workspace-shell shell-mk">
      <header class="landing-topbar portal-topbar float-nav" aria-label="AgentX 资料平台导航">
        <a class="landing-brand brand" href="/home" aria-label="返回 AgentX 首页">
          <span class="brand-mark logo">AX</span>
          <span data-product-name>AgentX</span>
        </a>
        <nav class="landing-nav portal-nav" aria-label="AgentX 资料平台导航"><span data-portal-nav></span><span class="portal-auth-slot" data-portal-auth><a href="/login">登录</a></span></nav>
        <div class="portal-skin-slot" data-agentx-skin-root></div>
      </header>

      <main class="portal-workspace-main updates-main reference-main" data-updates-root>
        <section class="workspace-title-block updates-title-block reveal d1" aria-label="新闻公告更新记录" data-i18n-aria-label="portal.updates.aria">
          <div>
            <h1 data-i18n="portal.updates.title">更新动态</h1>
            <p class="muted small mt8" data-i18n="portal.updates.lede">版本发布、平台新闻与服务公告。</p>
          </div>
          <a class="btn btn-ghost btn-sm secondary-button" href="/home#updates" data-i18n="portal.updates.back">返回首页更新区</a>
        </section>

        <section class="ann-filter updates-filter-row reveal d2" aria-label="新闻筛选" data-i18n-aria-label="portal.updates.filterAria">
          <button class="ann-fbtn updates-filter-button active" type="button" data-updates-filter="all" aria-pressed="true"><span data-i18n="updates.filter.all">全部</span> <span class="ct">0</span></button>
          <button class="ann-fbtn updates-filter-button" type="button" data-updates-filter="release" aria-pressed="false"><span data-i18n="updates.filter.release">版本发布</span> <span class="ct">0</span></button>
          <button class="ann-fbtn updates-filter-button" type="button" data-updates-filter="news" aria-pressed="false"><span data-i18n="updates.filter.news">新闻</span> <span class="ct">0</span></button>
          <button class="ann-fbtn updates-filter-button" type="button" data-updates-filter="announcement" aria-pressed="false"><span data-i18n="updates.filter.announcement">公告</span> <span class="ct">0</span></button>
        </section>

        <section class="updates-split-layout reveal d3" data-updates-layout aria-label="新闻列表与详情" data-i18n-aria-label="portal.updates.layoutAria">
          <aside class="updates-list-panel ann-list" aria-label="新闻列表" data-i18n-aria-label="portal.updates.listAria">
            <div class="updates-list" data-updates-list></div>
          </aside>
          <article id="updates-detail" class="updates-detail-panel" data-updates-detail tabindex="-1" aria-live="polite">
            <p class="muted-line" data-i18n="updates.select">选择一条查看详情。</p>
          </article>
        </section>
      </main>

      <footer class="landing-footer portal-footer">
        <span data-product-signature>Powered by AgentX</span>
        <span class="fingerprint-summary" data-product-fingerprint hidden></span>
        <div data-product-changelog></div>
      </footer>
    </div>

    <script src="/auth.js?v=2.2.42"></script><script src="/ui-kit.js?v=2.2.43"></script><script src="/product-shell.js?v=2.2.42"></script>
    <script src="/assets/agentx-webui.js?v=2.2.43"></script>
    <script src="/updates.js?v=2.2.43"></script>
  </body>
</html>
